# 服务端口、上下文
server:
  port: 8080
  servlet:
    context-path: /

spring:
  # 数据源 MySQL
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/log_anomaly?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: 123456
  servlet:
    multipart:
      max-file-size: 100MB      # 单个文件最大 100MB
      max-request-size: 100MB   # 整个请求最大 100MB
  #  # Redis 配置
  #  data:
  #    redis:
  #      host: 127.0.0.1
  #      port: 6379
  #      password:
  #      database: 0
  #      timeout: 3000ms
  #      lettuce:
  #        pool:
  #          max-active: 8
  #          max-idle: 8
  #          min-idle: 2
  #          max-wait: -1ms

  # Jackson 日期格式化
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.hzk.loganomaly.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 打印sql
  global-config:
    db-config:
      id-type: auto # 主键策略，auto自增

# jwt 配置
jwt:
  secret-key: abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyz1234567890
  expire-time: 36000000 # 毫秒   10H

# 日志配置
logging:
  level:
    root: info
    com.hzk.loganomaly: debug
    org.springframework: warn

# 自定义配置
my-config:
  access-log:
    # 日志上传batch
    batch-size: 2000
  # 规则引擎
  detect-rules:
    # 高频访问
    high-frequency:
      enabled: true
      # 每分钟访问量
      peak-per-minute: 60
      # 总访问数
      min-total: 60
    # 目录扫描
    scan:
      enabled: true
      # 404次数
      min-404: 10
      # 占比
      min-ratio: 0.2
    # 认证失败
    auth-failure:
      enabled: true
      # 总请求
      min-total: 20
      # 占比
      min-ratio: 0.5
  model-detect:
    enabled: true
    base-url: http://localhost:8000
    connect-timeout-ms: 3000
    read-timeout-ms: 60000