# 服务端口、上下文
server:
  port: 8080
  servlet:
    context-path: /

spring:
  # 数据源 MySQL
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/log_anomaly??useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: Sa123456

  #  # Redis 配置
  #  data:
  #    redis:
  #      host: 127.0.0.1
  #      port: 6379
  #      password:
  #      database: 0
  #      timeout: 3000ms
  #      lettuce:
  #        pool:
  #          max-active: 8
  #          max-idle: 8
  #          min-idle: 2
  #          max-wait: -1ms

  # Jackson 日期格式化
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.hzk.loganomaly.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 打印sql，生产关掉
  global-config:
    db-config:
      id-type: auto # 主键策略，auto自增
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 自定义 jwt 配置
jwt:
  secret-key: abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyz1234567890
  expire-time: 3600000 # 1H 毫秒

# 日志配置
logging:
  level:
    root: info
    com.hzk.loganomaly: debug
    org.springframework: warn
